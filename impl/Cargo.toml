workspace = { members = [ "bbases", "bbases_derive", "smdp"] }
[package]
name = "epirl"
version = "0.1.0"
edition = "2021"

[dependencies]
bbases = { path = "bbases" }
smdp = { path = "smdp" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
serde_json = "1.0"
frozenset = { version = "0.2", features = ["serde"] }
ordered-float = { version = "4.2", features = ["serde"] }
indexmap = {version = "2.3", features = ["serde"]}
kissat = "0.1"
cat_solver = "3.1.1"
#caqe = { git = "https://github.com/ltentrup/caqe" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3